<header class="app-header">
  <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top shadow-sm" [class.scrolled]="isScrolled">
    <div class="container">
      <!-- Brand Logo -->
      <a class="navbar-brand d-flex align-items-center" routerLink="/">
        <div class="brand-logo">
          <i class="fas fa-store"></i>
        </div>
        <div class="brand-info">
          <span class="brand-text">RIMSS</span>
          <span class="brand-tagline">Store</span>
        </div>
      </a>

      <!-- Mobile Menu Toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
              aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navigation Menu -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto ms-4">
          <li class="nav-item">
            <a class="nav-link nav-link-modern" routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
              <i class="fas fa-home me-1"></i>
              <span>Home</span>
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-modern" routerLink="/products" routerLinkActive="active">
              <i class="fas fa-box-open me-1"></i>
              <span>Products</span>
            </a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link nav-link-modern dropdown-toggle" href="#" id="categoriesDropdown" role="button" 
               data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fas fa-th-large me-1"></i>
              <span>Categories</span>
            </a>
            <ul class="dropdown-menu modern-dropdown" aria-labelledby="categoriesDropdown">
              <li><a class="dropdown-item" href="#"><i class="fas fa-laptop me-2 text-primary"></i>Electronics</a></li>
              <li><a class="dropdown-item" href="#"><i class="fas fa-tshirt me-2 text-success"></i>Fashion</a></li>
              <li><a class="dropdown-item" href="#"><i class="fas fa-home me-2 text-warning"></i>Home & Garden</a></li>
              <li><a class="dropdown-item" href="#"><i class="fas fa-gamepad me-2 text-info"></i>Sports & Games</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item fw-bold" href="#"><i class="fas fa-th me-2 text-dark"></i>View All Categories</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link nav-link-modern" href="#">
              <i class="fas fa-tags me-1"></i>
              <span>Deals</span>
              <span class="badge bg-danger ms-1">Hot</span>
            </a>
          </li>
        </ul>

        <!-- Enhanced Search Bar -->
        <div class="search-container me-4">
          <form class="search-form" role="search" (ngSubmit)="onSearch()">
            <div class="input-group search-input-group">
              <span class="input-group-text search-icon">
                <i class="fas fa-search"></i>
              </span>
              <input class="form-control search-input-modern" type="search" 
                     placeholder="Search for products, brands, and more..." 
                     aria-label="Search" [(ngModel)]="searchQuery" name="search"
                     (keypress)="onSearchKeyPress($event)">
              <button class="btn btn-primary search-btn" type="submit">
                <span class="d-none d-md-inline">Search</span>
                <i class="fas fa-search d-md-none"></i>
              </button>
            </div>
          </form>
        </div>

        <!-- User Actions -->
        <div class="user-actions d-flex align-items-center">
          <!-- Wishlist -->
          <div class="action-item me-3">
            <a class="action-link" href="#" title="Wishlist">
              <div class="action-icon">
                <i class="fas fa-heart"></i>
                <span class="action-badge">3</span>
              </div>
              <span class="action-text d-none d-lg-block">Wishlist</span>
            </a>
          </div>

          <!-- Shopping Cart -->
          <div class="action-item me-3">
            <a class="action-link" routerLink="/checkout" routerLinkActive="active" title="Shopping Cart">
              <div class="action-icon">
                <i class="fas fa-shopping-cart"></i>
                <span class="action-badge" *ngIf="cartCount > 0">{{cartCount}}</span>
              </div>
              <span class="action-text d-none d-lg-block">Cart</span>
            </a>
          </div>

       
          
          <!-- Login/Signup Buttons -->
         
            <div class="auth-buttons">
             <button *ngIf="!loginDisplay" class="btn btn-outline-primary me-2" type="button" (click)="login()">
              <i class="fas fa-sign-in-alt me-1"></i>
              <span>Login</span>
            </button>

            <!-- User Info when logged in -->
            <div *ngIf="loginDisplay" class="d-flex align-items-center">
              <span class="text-muted me-3">
                <i class="fas fa-user me-1"></i>
                Welcome, {{userName}}
              </span>
              <button class="btn btn-outline-danger me-2" type="button" (click)="logout()">
                <i class="fas fa-sign-out-alt me-1"></i>
                <span>Logout</span>
              </button>
            </div>
            
              <button class="btn btn-primary" *ngIf="!loginDisplay" type="button" (click)="openSignupModal()">
                <i class="fas fa-user-plus me-1"></i>
                <span>Sign Up</span>
              </button>
            </div>
        
        </div>
      </div>
    </div>
  </nav>
</header>
